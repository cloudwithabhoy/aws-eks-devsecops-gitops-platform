# Checks that apply to every change, whatever path it touches.
# The same pre-commit hooks run locally on each commit; this is the enforced copy,
# since local hooks can be skipped with `git commit --no-verify`.
name: repo-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN can only read the repo
permissions:
  contents: read

# A new push to the same PR cancels the run still checking the old commit.
# Runs on main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit (all files)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit SHA: a tag can be moved to malicious code, a SHA can't
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Hook environments (including the compiled Gitleaks) take minutes to build; reuse them
      # until .pre-commit-config.yaml changes
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      # The gitleaks hook only scans *staged* changes, which is empty in CI;
      # the gitleaks job below scans the full history instead.
      - name: Run hooks
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Same version as the pre-commit hook
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret deleted in a later commit is still in Git and still leaked
          fetch-depth: 0
          persist-credentials: false

      # The release binary, verified against a pinned checksum, instead of a third-party action
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: |
          gitleaks git --redact --verbose --no-banner \
            --log-opts="--all" \
            --report-format json --report-path gitleaks-report.json .

      # Findings are redacted, so the summary never prints the secret itself
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Gitleaks (full history)"
            if [ -s gitleaks-report.json ] && [ "$(jq length gitleaks-report.json)" -gt 0 ]; then
              echo "**$(jq length gitleaks-report.json) finding(s):**"
              echo
              echo "| Rule | File | Commit |"
              echo "|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | `\(.File)` | `\(.Commit[0:7])` |"' gitleaks-report.json
            else
              echo "No leaks found in $(git rev-list --count --all) commits."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
