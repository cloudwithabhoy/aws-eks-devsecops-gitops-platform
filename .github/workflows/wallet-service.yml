# Thin caller: wallet-service runs the golden pipeline only when its own files change.
# Bot PRs that touch only gitops/ (Phase 3) don't match these paths, so they never retrigger CI.
name: wallet-service

on:
  push:
    branches: [main]
    paths:
      - services/wallet-service/**
      - .github/workflows/service-ci.yml
      - .github/workflows/wallet-service.yml
  pull_request:
    paths:
      - services/wallet-service/**
      - .github/workflows/service-ci.yml
      - .github/workflows/wallet-service.yml
  workflow_dispatch:

# A reusable workflow can never get more permissions than its caller grants
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: wallet-service
      language: java
